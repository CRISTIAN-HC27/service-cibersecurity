worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/json;

  # No versionar la versión de nginx (PR.PS)
  server_tokens off;

  # --- Rate limit en la red (2ª capa, antes de llegar a la API) ---
  limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  # Log estructurado para detección de incidentes (NIST DE.CM)
  log_format structured escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"body_bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time","request_id":"$request_id",'
    '"user_agent":"$http_user_agent"}';
  access_log /var/log/nginx/access.log structured;

  upstream api {
    server api:3000;
    keepalive 32;
  }

  # Redirección a HTTPS (HSTS + TLS obligatorio - NIST PR.DS)
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS y Permissions-Policy en el borde; el resto de cabeceras de
    # seguridad las envía helmet (valores idénticos, sin duplicados).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    limit_conn conn 20;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok";
    }

    # Rutas de autenticación: límite más estricto en el borde de red
    location ~ ^/auth/(login|register|refresh|logout)$ {
      limit_req zone=auth burst=5 nodelay;
      limit_req_status 429;

      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Sobrescribe (no acumula) X-Forwarded-For: el cliente NO puede
      # falsear la IP que usará la API para el rate limit.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Connection "";
      proxy_read_timeout 30s;
    }

    location / {
      limit_req zone=api burst=20 nodelay;
      limit_req_status 429;

      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Connection "";
      proxy_read_timeout 30s;
    }
  }
}
