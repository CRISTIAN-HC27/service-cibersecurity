name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # prisma.config.ts exige la variable aunque `generate` no toque la BD.
  DATABASE_URL: postgresql://app:ci-placeholder@127.0.0.1:5432/login_service

jobs:
  checks:
    name: Lint, tipos, build y auditoría
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run audit

  unit:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  e2e:
    name: Pruebas e2e (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: login_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d login_service_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://app:ci-password@127.0.0.1:5432/login_service_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:e2e
